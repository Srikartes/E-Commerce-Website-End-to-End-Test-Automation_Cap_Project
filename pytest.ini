#addopts = -v --headed -n 0 --html=report.html --self-contained-html
[pytest]
addopts = --html=reports/report.html --self-contained-html --numprocesses=auto --reruns=2
testpaths = tests
pythonpath = .
markers =
    smoke: Quick critical path verification
    regression: Comprehensive test coverage suite
    ui: Frontend user interface verification
    api: Isolated backend service endpoint verification

